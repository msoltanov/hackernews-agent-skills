name: CI

"on":
  push:
  pull_request:

permissions: {}

jobs:
  tests:
    name: "Offline tests (Python ${{ matrix.python-version }})"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout (v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python (v5.6.0)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Validate skill metadata
        run: python scripts/validate_skills.py
      - name: Test skill validator
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test read-only discovery helper
        run: python -m unittest discover -s skills/hn-discover/scripts -p 'test_*.py' -v
      - name: Test thread-context helper
        run: python -m unittest discover -s skills/hn-comment-suggest/scripts -p 'test_*.py' -v

  style:
    name: Style and types
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python (v5.6.0)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python formatting
        run: python -m ruff format --check --diff .
      - name: Lint Python
        run: python -m ruff check .
      - name: Check Python types
        run: python -m pyright
      - name: Lint Markdown
        run: python -m pymarkdown --config .pymarkdown.json scan --recurse --exclude .venv .
      - name: Lint YAML
        run: python -m yamllint --strict -c .yamllint.yaml .github/workflows/ci.yml .yamllint.yaml
