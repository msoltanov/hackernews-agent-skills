name: Release

"on":
  push:
    tags:
      - v*.*.*

permissions: {}

jobs:
  release:
    name: Build claude.ai skill zips
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python (v5.6.0)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Validate skill metadata
        run: python scripts/validate_skills.py
      - name: Build skill zips
        run: python scripts/build_skill_zips.py --output dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: "${{ github.ref_name }}"
        run: gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --verify-tag
