[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4
src = ["scripts", "skills/hn-discover/scripts", "skills/hn-comment-suggest/scripts"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "PIE",
  "RET",
  "RUF",
  "D",
  "Q",
  "T20",
]
ignore = [
  "E501",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
]
fixable = ["ALL"]
unfixable = ["ERA001"]

[tool.ruff.lint.isort]
known-first-party = ["hn_readonly", "hn_thread_context", "validate_skills"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["D", "S101", "T20"]
"**/scripts/*.py" = ["T20"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pyright]
include = ["scripts", "skills"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
extraPaths = ["scripts", "skills/hn-discover/scripts", "skills/hn-comment-suggest/scripts"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
reportMatchNotExhaustive = "error"
